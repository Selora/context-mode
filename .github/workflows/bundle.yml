name: Bundle MCP Server & CLI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.5"

      - run: npm install

      - name: Build compiled runtime and bundles
        run: |
          # Do not retain compiled modules deleted from src since the last build.
          rm -rf build
          # Includes typechecking, bundling and both artifact invariant checks.
          npm run build

      - name: Commit build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build/ server.bundle.mjs cli.bundle.mjs hooks/session-extract.bundle.mjs hooks/session-snapshot.bundle.mjs hooks/session-db.bundle.mjs hooks/security.bundle.mjs
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "ci: update compiled runtime and MCP, CLI, hook and security bundles"
          git push
